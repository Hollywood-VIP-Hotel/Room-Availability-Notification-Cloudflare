name: Room Availability Notification Test
on:
  workflow_dispatch:  # Manual trigger only — run this from the Actions tab
jobs:
  test-fetch-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test script (API + Make webhook)
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          EZEE_HOTEL_CODE: ${{ secrets.EZEE_HOTEL_CODE }}
          EZEE_AUTH_CODE: ${{ secrets.EZEE_AUTH_CODE }}
        run: |
          python scrapertest.py
