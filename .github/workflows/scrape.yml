name: Room Availability Notification Cloudflare
on:
  workflow_dispatch:  # Allows manual triggers (optional)
  repository_dispatch:
    types: [external-trigger]  # This is the event type your Cloudflare Worker will send
jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch availability via eZee API
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          EZEE_HOTEL_CODE: ${{ secrets.EZEE_HOTEL_CODE }}
          EZEE_AUTH_CODE: ${{ secrets.EZEE_AUTH_CODE }}
          EZEE_ROOM_TYPE_ID_1: ${{ secrets.EZEE_ROOM_TYPE_ID_1 }}
          EZEE_ROOM_TYPE_ID_2: ${{ secrets.EZEE_ROOM_TYPE_ID_2 }}
          EZEE_ROOM_TYPE_ID_3: ${{ secrets.EZEE_ROOM_TYPE_ID_3 }}
        run: |
          python scraper.py
